name: Index uploaded files

on:
  push:
    branches: [main]
    paths:
      - "data/*/uploads/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: List the files in each uploads folder
        run: python3 collector/manifest.py

      - name: Save the list to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "The list is already up to date."
          else
            git commit -m "Index uploaded files"
            git pull --rebase origin main
            git push
          fi
