name: Collect posts

on:
  schedule:
    - cron: "17 9 * * *" # every day at 09:17 UTC (5:17am Eastern in summer)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config.json"
      - "collector/**"
      - ".github/workflows/collect.yml"

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check the collector
        run: python3 -m unittest discover -s collector -p "test_*.py"

      - name: Collect posts
        id: collect
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
        run: python3 collector/collect.py

      - name: Save the results to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nothing new to save."
          else
            git commit -m "Collect posts $(date -u +%F)"
            git pull --rebase origin main
            git push
          fi

      - name: Flag sources that failed
        if: steps.collect.outcome == 'failure'
        run: |
          echo "At least one source failed. Open the run summary to see which." >&2
          exit 1
